<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Times Table Trainer</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1923;
    --surface: #162030;
    --card: #1e2d3d;
    --accent: #f5c842;
    --green: #3ddc84;
    --red: #ff5f6d;
    --blue: #4fc3f7;
    --purple: #b39ddb;
    --text: #e8f0fe;
    --muted: #7b8fa6;
    --border: #2a3f55;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
    background-image:
      radial-gradient(ellipse at 20% 20%, rgba(79,195,247,0.06) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(245,200,66,0.05) 0%, transparent 60%);
  }

  h1 {
    font-family: 'Fredoka One', cursive;
    font-size: 2.4rem;
    color: var(--accent);
    letter-spacing: 1px;
    text-shadow: 0 0 30px rgba(245,200,66,0.3);
    margin-bottom: 4px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 28px;
    font-weight: 600;
  }

  .app-container {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
  }

  /* ── SETUP ── */
  #setup-screen label {
    display: block;
    font-weight: 700;
    font-size: 0.85rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }

  .input-row {
    display: flex;
    gap: 10px;
  }

  input[type="number"] {
    flex: 1;
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    font-size: 1.2rem;
    font-weight: 700;
    padding: 12px 16px;
    outline: none;
    transition: border-color 0.2s;
  }

  input[type="number"]:focus { border-color: var(--accent); }
  input[type="number"]::-webkit-inner-spin-button { opacity: 0; }

  .btn {
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-family: 'Fredoka One', cursive;
    font-size: 1.05rem;
    letter-spacing: 0.5px;
    padding: 12px 22px;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .btn-primary {
    background: var(--accent);
    color: #1a1200;
    box-shadow: 0 4px 18px rgba(245,200,66,0.3);
  }
  .btn-primary:hover { box-shadow: 0 6px 24px rgba(245,200,66,0.45); }

  .btn-green {
    background: var(--green);
    color: #0a2015;
    box-shadow: 0 4px 18px rgba(61,220,132,0.3);
  }

  .btn-red {
    background: var(--red);
    color: #fff;
    box-shadow: 0 4px 18px rgba(255,95,109,0.25);
  }

  .btn-ghost {
    background: transparent;
    border: 2px solid var(--border);
    color: var(--muted);
  }
  .btn-ghost:hover { border-color: var(--text); color: var(--text); }

  /* ── QUESTION SCREEN ── */
  #quiz-screen { display: none; }

  .progress-bar-wrap {
    background: var(--bg);
    border-radius: 99px;
    height: 6px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--blue), var(--accent));
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  .meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    font-size: 0.82rem;
    color: var(--muted);
    font-weight: 700;
  }

  .badge {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 99px;
    padding: 4px 12px;
    font-size: 0.78rem;
    font-weight: 800;
  }

  .question-display {
    text-align: center;
    padding: 24px 0 20px;
  }

  .question-text {
    font-family: 'Fredoka One', cursive;
    font-size: 2.8rem;
    color: var(--text);
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  .question-text span { color: var(--accent); }

  .timer-display {
    font-family: 'Fredoka One', cursive;
    font-size: 1.5rem;
    color: var(--blue);
    letter-spacing: 2px;
  }

  .timer-display.warning { color: var(--red); }

  .answer-row {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  #answer-input {
    flex: 1;
    font-size: 1.4rem;
    text-align: center;
    padding: 14px;
  }

  .feedback-box {
    border-radius: 12px;
    padding: 14px 18px;
    margin-top: 14px;
    font-weight: 700;
    font-size: 0.95rem;
    display: none;
    align-items: center;
    gap: 10px;
  }

  .feedback-box.correct {
    background: rgba(61,220,132,0.12);
    border: 1.5px solid var(--green);
    color: var(--green);
  }

  .feedback-box.wrong {
    background: rgba(255,95,109,0.10);
    border: 1.5px solid var(--red);
    color: var(--red);
  }

  .feedback-icon { font-size: 1.3rem; }

  /* ── HISTORY ── */
  #history-section .section-title {
    font-family: 'Fredoka One', cursive;
    font-size: 1.1rem;
    color: var(--accent);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .session-block {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
  }

  .session-header {
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    user-select: none;
  }
  .session-header:hover { background: rgba(255,255,255,0.03); }

  .session-title {
    font-weight: 800;
    font-size: 0.92rem;
    color: var(--blue);
  }

  .session-stats {
    font-size: 0.78rem;
    color: var(--muted);
    font-weight: 700;
  }

  .session-rows {
    display: none;
    padding: 0 16px 12px;
    border-top: 1px solid var(--border);
  }

  .session-rows.open { display: block; }

  .hist-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 0;
    font-size: 0.85rem;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .hist-row:last-child { border-bottom: none; }

  .hist-q { flex: 1; font-weight: 700; }
  .hist-answer { font-family: 'Fredoka One', cursive; font-size: 0.95rem; }
  .hist-correct { color: var(--green); }
  .hist-wrong { color: var(--red); }
  .hist-time { color: var(--muted); font-size: 0.78rem; min-width: 48px; text-align: right; }

  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 28px 0;
    font-size: 0.9rem;
  }

  .actions-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  /* ── FINISH BANNER ── */
  #finish-banner {
    display: none;
    text-align: center;
    padding: 30px 24px;
  }

  .finish-emoji { font-size: 3rem; margin-bottom: 12px; }

  .finish-title {
    font-family: 'Fredoka One', cursive;
    font-size: 1.8rem;
    color: var(--accent);
    margin-bottom: 6px;
  }

  .finish-sub {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 20px;
    font-weight: 600;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 22px;
  }

  .stat-tile {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 8px;
    text-align: center;
  }

  .stat-val {
    font-family: 'Fredoka One', cursive;
    font-size: 1.6rem;
    color: var(--accent);
  }

  .stat-lbl {
    font-size: 0.72rem;
    color: var(--muted);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin-top: 3px;
  }

  .chevron {
    font-size: 0.75rem;
    transition: transform 0.2s;
  }
  .open .chevron { transform: rotate(180deg); }

  @keyframes pop-in {
    from { transform: scale(0.85); opacity: 0; }
    to   { transform: scale(1);    opacity: 1; }
  }
  .pop { animation: pop-in 0.25s ease; }
</style>
</head>
<body>

<h1>✖ Times Table Trainer</h1>
<p class="subtitle">Master multiplication, one question at a time</p>

<div class="app-container">

  <!-- SETUP -->
  <div class="card" id="setup-screen">
    <label>Which table do you want to practice?</label>
    <div class="input-row">
      <input type="number" id="table-input" placeholder="e.g. 22" min="1" max="999">
      <button class="btn btn-primary" id="start-btn" onclick="startQuiz()">Start →</button>
    </div>
    <p id="setup-error" style="color:var(--red);font-size:0.82rem;margin-top:8px;display:none;">Please enter a valid number.</p>
  </div>

  <!-- QUIZ -->
  <div class="card" id="quiz-screen">
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
    </div>
    <div class="meta-row">
      <span id="q-counter">Question 1 / 10</span>
      <span class="badge" id="score-badge">✓ 0 &nbsp;✗ 0</span>
    </div>
    <div class="question-display">
      <div class="question-text" id="question-text">__ × __ = ?</div>
      <div class="timer-display" id="timer-display">00:00</div>
    </div>
    <div class="answer-row">
      <input type="number" id="answer-input" placeholder="Your answer…" autocomplete="off">
      <button class="btn btn-primary" id="submit-btn" onclick="submitAnswer()">Check</button>
    </div>
    <div class="feedback-box" id="feedback-box">
      <span class="feedback-icon" id="feedback-icon"></span>
      <span id="feedback-text"></span>
    </div>
    <div style="margin-top:16px; display:flex; gap:8px; justify-content:flex-end;">
      <button class="btn btn-ghost" style="font-size:0.82rem;padding:8px 14px;" onclick="nextQuestion()" id="next-btn" style="display:none">Next →</button>
    </div>
  </div>

  <!-- FINISH -->
  <div class="card" id="finish-banner">
    <div class="finish-emoji" id="finish-emoji">🎉</div>
    <div class="finish-title">Session Complete!</div>
    <div class="finish-sub" id="finish-sub">Here's how you did:</div>
    <div class="stats-grid">
      <div class="stat-tile"><div class="stat-val" id="stat-correct">0</div><div class="stat-lbl">Correct</div></div>
      <div class="stat-tile"><div class="stat-val" id="stat-wrong">0</div><div class="stat-lbl">Wrong</div></div>
      <div class="stat-tile"><div class="stat-val" id="stat-time">0s</div><div class="stat-lbl">Total Time</div></div>
    </div>
    <div class="actions-row">
      <button class="btn btn-primary" onclick="restartSameTable()">Retry Table</button>
      <button class="btn btn-ghost" onclick="backToSetup()">New Table</button>
    </div>
  </div>

  <!-- HISTORY -->
  <div id="history-section">
    <div class="section-title">
      <span>📋 Session History</span>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost" style="font-size:0.8rem;padding:7px 14px;" onclick="clearHistory()">Clear</button>
        <button class="btn btn-primary" style="font-size:0.8rem;padding:7px 14px;" onclick="downloadPDF()">⬇ PDF</button>
      </div>
    </div>
    <div id="history-list">
      <div class="empty-state">No sessions yet. Start practising!</div>
    </div>
  </div>

</div>

<script>
// ── STATE ──
let tableNum = 0;
let questions = [];         // shuffled multipliers 1–10
let currentIdx = 0;
let correct = 0, wrong = 0;
let timerInterval = null;
let questionStartTime = 0;
let questionElapsed = 0;   // seconds for current question
let sessionHistory = [];    // array of sessions
let currentSession = null;
let answered = false;

// ── SETUP ──
document.getElementById('table-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') startQuiz();
});
document.getElementById('answer-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (!answered) submitAnswer();
    else nextQuestion();
  }
});

function startQuiz() {
  const val = parseInt(document.getElementById('table-input').value);
  if (!val || val < 1) {
    document.getElementById('setup-error').style.display = 'block';
    return;
  }
  document.getElementById('setup-error').style.display = 'none';
  tableNum = val;

  // Shuffle 1–10
  // questions = Array.from({length: 10}, (_, i) => i + 1);
  questions = Array.from({length: 20}, (_, i) => i + 1);
  for (let i = questions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [questions[i], questions[j]] = [questions[j], questions[i]];
  }

  currentIdx = 0;
  correct = 0;
  wrong = 0;
  currentSession = { table: tableNum, rows: [], date: new Date() };

  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'block';
  document.getElementById('finish-banner').style.display = 'none';

  loadQuestion();
}

// ── QUIZ ──
function loadQuestion() {
  answered = false;
  const multiplier = questions[currentIdx];
  document.getElementById('question-text').innerHTML =
    `<span>${tableNum}</span> × ${multiplier} = ?`;
  document.getElementById('q-counter').textContent =
    `Question ${currentIdx + 1} / 20`;
  document.getElementById('progress-fill').style.width =
    `${(currentIdx / 20) * 100}%`;
  // document.getElementById('q-counter').textContent =
  //   `Question ${currentIdx + 1} / 10`;
  // document.getElementById('progress-fill').style.width =
  //   `${(currentIdx / 10) * 100}%`;
  document.getElementById('score-badge').textContent =
    `✓ ${correct}  ✗ ${wrong}`;
  document.getElementById('answer-input').value = '';
  document.getElementById('answer-input').disabled = false;
  document.getElementById('submit-btn').disabled = false;
  document.getElementById('answer-input').focus();

  const fb = document.getElementById('feedback-box');
  fb.style.display = 'none';
  fb.className = 'feedback-box';
  document.getElementById('next-btn').style.visibility = 'hidden';

  // Timer
  clearInterval(timerInterval);
  questionStartTime = Date.now();
  questionElapsed = 0;
  updateTimerDisplay(0);
  timerInterval = setInterval(() => {
    questionElapsed = (Date.now() - questionStartTime) / 1000;
    updateTimerDisplay(questionElapsed);
  }, 100);

  document.getElementById('question-text').classList.remove('pop');
  void document.getElementById('question-text').offsetWidth;
  document.getElementById('question-text').classList.add('pop');
}

function updateTimerDisplay(secs) {
  const mins = Math.floor(secs / 60);
  const s = secs % 60;
  const str = `${String(mins).padStart(2,'0')}:${s.toFixed(1).padStart(4,'0')}`;
  const el = document.getElementById('timer-display');
  el.textContent = str;
  el.className = 'timer-display' + (secs > 30 ? ' warning' : '');
}

function submitAnswer() {
  if (answered) return;
  clearInterval(timerInterval);
  answered = true;

  const raw = document.getElementById('answer-input').value.trim();
  const userAns = parseInt(raw);
  const multiplier = questions[currentIdx];
  const correctAns = tableNum * multiplier;
  const elapsed = (Date.now() - questionStartTime) / 1000;
  const isCorrect = userAns === correctAns;

  if (isCorrect) correct++; else wrong++;

  currentSession.rows.push({
    q: `${tableNum} × ${multiplier}`,
    userAns: isNaN(userAns) ? '(blank)' : userAns,
    correct: correctAns,
    isCorrect,
    time: elapsed
  });

  const fb = document.getElementById('feedback-box');
  fb.style.display = 'flex';
  if (isCorrect) {
    fb.className = 'feedback-box correct pop';
    document.getElementById('feedback-icon').textContent = '✓';
    document.getElementById('feedback-text').textContent =
      `Correct! ${tableNum} × ${multiplier} = ${correctAns}`;
  } else {
    fb.className = 'feedback-box wrong pop';
    document.getElementById('feedback-icon').textContent = '✗';
    document.getElementById('feedback-text').textContent =
      `Not quite. ${tableNum} × ${multiplier} = ${correctAns} (you said ${isNaN(userAns) ? '(nothing)' : userAns})`;
  }

  document.getElementById('score-badge').textContent = `✓ ${correct}  ✗ ${wrong}`;
  document.getElementById('answer-input').disabled = true;
  document.getElementById('submit-btn').disabled = true;

  const nextBtn = document.getElementById('next-btn');
  nextBtn.style.visibility = 'visible';
  // nextBtn.textContent = currentIdx < 9 ? 'Next →' : 'Finish ✓';
  nextBtn.textContent = currentIdx < 19 ? 'Next →' : 'Finish ✓';
}

// function nextQuestion() {
//   if (!answered) return;
//   currentIdx++;
//   if (currentIdx < 10) {
//     loadQuestion();
//   } else {
//     finishSession();
//   }
// }
function nextQuestion() {
  if (!answered) return;
  currentIdx++;
  if (currentIdx < 20) {
    loadQuestion();
  } else {
    finishSession();
  }
}

function finishSession() {
  clearInterval(timerInterval);
  document.getElementById('quiz-screen').style.display = 'none';

  const totalTime = currentSession.rows.reduce((s, r) => s + r.time, 0);
  currentSession.totalTime = totalTime;
  currentSession.correct = correct;
  currentSession.wrong = wrong;
  sessionHistory.unshift(currentSession);

  // Stats
  document.getElementById('stat-correct').textContent = correct;
  document.getElementById('stat-wrong').textContent = wrong;
  document.getElementById('stat-time').textContent = totalTime.toFixed(1) + 's';
  // document.getElementById('finish-emoji').textContent =
  //   correct === 10 ? '🏆' : correct >= 7 ? '🎉' : correct >= 5 ? '😊' : '💪';
  document.getElementById('finish-emoji').textContent =
    correct === 20 ? '🏆' : correct >= 7 ? '🎉' : correct >= 5 ? '😊' : '💪';
  // document.getElementById('finish-sub').textContent =
  //   correct === 10 ? 'Perfect score! Incredible!' :
  //   correct >= 7 ? 'Great job! Keep it up!' :
  //   'Keep practising — you\'ll get there!';
  document.getElementById('finish-sub').textContent =
    correct === 20 ? 'Perfect score! Incredible!' :
    correct >= 17 ? 'Great job! Keep it up!' :
    'Keep practising — you\'ll get there!';
  document.getElementById('progress-fill').style.width = '100%';

  const banner = document.getElementById('finish-banner');
  banner.style.display = 'block';
  banner.classList.remove('pop');
  void banner.offsetWidth;
  banner.classList.add('pop');

  renderHistory();
}

function restartSameTable() {
  document.getElementById('finish-banner').style.display = 'none';
  document.getElementById('table-input').value = tableNum;
  startQuiz();
}

function backToSetup() {
  document.getElementById('finish-banner').style.display = 'none';
  document.getElementById('setup-screen').style.display = 'block';
}

// ── HISTORY ──
function renderHistory() {
  const container = document.getElementById('history-list');
  if (sessionHistory.length === 0) {
    container.innerHTML = '<div class="empty-state">No sessions yet. Start practising!</div>';
    return;
  }
  container.innerHTML = '';
  sessionHistory.forEach((sess, si) => {
    const dateStr = sess.date.toLocaleString();
    const block = document.createElement('div');
    block.className = 'session-block';
    // const pct = Math.round((sess.correct / 10) * 100);
    const pct = Math.round((sess.correct / 20) * 100);
    block.innerHTML = `
      <div class="session-header" onclick="toggleSession(${si}, this)">
        <div>
          <div class="session-title">Table of ${sess.table} &nbsp;·&nbsp; ${pct}%</div>
          <div class="session-stats">${dateStr} &nbsp;·&nbsp; ${sess.totalTime.toFixed(1)}s total</div>
        </div>
        <span class="chevron">▼</span>
      </div>
      <div class="session-rows" id="sess-rows-${si}">
        ${sess.rows.map(r => `
          <div class="hist-row">
            <span class="hist-q">${r.q}</span>
            <span class="hist-answer ${r.isCorrect ? 'hist-correct' : 'hist-wrong'}">
              ${r.isCorrect ? '✓' : '✗'} ${r.userAns}
              ${!r.isCorrect ? `<span style="color:var(--muted);font-size:0.8rem"> → ${r.correct}</span>` : ''}
            </span>
            <span class="hist-time">${r.time.toFixed(1)}s</span>
          </div>
        `).join('')}
      </div>
    `;
    container.appendChild(block);
  });
}

function toggleSession(idx, headerEl) {
  const rows = document.getElementById(`sess-rows-${idx}`);
  rows.classList.toggle('open');
  headerEl.classList.toggle('open');
}

function clearHistory() {
  if (!sessionHistory.length) return;
  if (confirm('Clear all session history?')) {
    sessionHistory = [];
    renderHistory();
  }
}

// ── PDF EXPORT ──
function downloadPDF() {
  if (sessionHistory.length === 0) {
    alert('No history to export yet!');
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });

  const W = 210, margin = 18;
  let y = margin;

  const addPage = () => { doc.addPage(); y = margin; };
  const checkY = (need = 10) => { if (y + need > 280) addPage(); };

  // Title
  doc.setFillColor(15, 25, 35);
  doc.rect(0, 0, W, 30, 'F');
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(18);
  doc.setTextColor(245, 200, 66);
  doc.text('Times Table Trainer — Session Report', margin, 19);
  doc.setFontSize(8);
  doc.setTextColor(123, 143, 166);
  doc.text(`Generated: ${new Date().toLocaleString()}`, margin, 26);
  y = 38;

  sessionHistory.forEach((sess, si) => {
    checkY(40);

    // Session header bar
    doc.setFillColor(30, 45, 61);
    doc.roundedRect(margin - 2, y - 4, W - (margin - 2) * 2, 12, 2, 2, 'F');
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);
    doc.setTextColor(79, 195, 247);
    doc.text(`Session ${si + 1} — Table of ${sess.table}`, margin + 1, y + 4);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8);
    doc.setTextColor(123, 143, 166);
    doc.text(
      `${sess.date.toLocaleString()}  ·  ✓ ${sess.correct}  ✗ ${sess.wrong}  ·  Total: ${sess.totalTime.toFixed(1)}s`,
      margin + 1, y + 9.5
    );
    y += 16;

    // Column headers
    checkY(8);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(8);
    doc.setTextColor(123, 143, 166);
    doc.text('Question', margin, y);
    doc.text('Your Answer', margin + 48, y);
    doc.text('Correct Answer', margin + 88, y);
    doc.text('Result', margin + 130, y);
    doc.text('Time', margin + 154, y);
    y += 2;
    doc.setDrawColor(42, 63, 85);
    doc.setLineWidth(0.3);
    doc.line(margin, y, W - margin, y);
    y += 5;

    sess.rows.forEach((r, ri) => {
      checkY(7);
      const bg = ri % 2 === 0;
      if (bg) {
        doc.setFillColor(22, 32, 48);
        doc.rect(margin - 2, y - 4, W - (margin - 2) * 2, 6.5, 'F');
      }
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9);
      doc.setTextColor(232, 240, 254);
      doc.text(r.q, margin, y);
      doc.text(String(r.userAns), margin + 48, y);
      doc.text(String(r.correct), margin + 88, y);

      if (r.isCorrect) {
        doc.setTextColor(61, 220, 132);
        doc.text('✓ Correct', margin + 130, y);
      } else {
        doc.setTextColor(255, 95, 109);
        doc.text('✗ Wrong', margin + 130, y);
      }
      doc.setTextColor(123, 143, 166);
      doc.text(`${r.time.toFixed(1)}s`, margin + 154, y);
      y += 7;
    });

    y += 6;
  });

  doc.save('times-table-history.pdf');
}
</script>
</body>
</html>
